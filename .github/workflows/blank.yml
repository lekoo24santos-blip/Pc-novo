-- ==========================================
--           PC NOVO - PC GAMER
-- ==========================================

local PC = {
    nome = "PC NOVO",
    cpu = "AMD Ryzen 9 9950X",
    gpu = "NVIDIA RTX 5090",
    ram = 64,
    armazenamento = 4000,
    sistema = "Windows 11"
}

local jogos = {
    {
        nome = "GTA V",
        ram = 8,
        fps = 180
    },

    {
        nome = "GTA VI",
        ram = 16,
        fps = 100
    },

    {
        nome = "Cyberpunk 2077",
        ram = 16,
        fps = 140
    },

    {
        nome = "Red Dead Redemption 2",
        ram = 12,
        fps = 160
    },

    {
        nome = "Microsoft Flight Simulator",
        ram = 32,
        fps = 120
    }
}


-- ==========================================
-- FUNÇÃO PARA MOSTRAR UMA LINHA
-- ==========================================

local function linha()
    print("------------------------------------------")
end


-- ==========================================
-- MOSTRAR INFORMAÇÕES DO PC
-- ==========================================

local function mostrarPC()

    linha()

    print("             " .. PC.nome)

    linha()

    print("CPU: " .. PC.cpu)
    print("GPU: " .. PC.gpu)
    print("RAM: " .. PC.ram .. " GB")
    print("SSD: " .. PC.armazenamento .. " GB")
    print("Sistema: " .. PC.sistema)

    linha()

end


-- ==========================================
-- VERIFICAR UM JOGO
-- ==========================================

local function verificarJogo(jogo)

    print("")
    print("JOGO: " .. jogo.nome)

    if PC.ram >= jogo.ram then

        print("RAM: OK")
        print("FPS estimado: " .. jogo.fps)

        if jogo.fps >= 120 then
            print("STATUS: EXCELENTE")

        elseif jogo.fps >= 60 then
            print("STATUS: BOM")

        else
            print("STATUS: FRACO")
        end

    else

        print("RAM: INSUFICIENTE")
        print("RAM necessaria: " .. jogo.ram .. " GB")

    end

end


-- ==========================================
-- INICIAR O PC
-- ==========================================

local function iniciarPC()

    print("")
    print("INICIANDO PC NOVO...")
    print("")

    print("Carregando CPU...")
    print("Carregando GPU...")
    print("Carregando RAM...")
    print("Carregando sistema...")

    print("")
    print("PC INICIADO!")

    mostrarPC()

    print("")
    print("JOGOS TESTADOS:")

    for _, jogo in ipairs(jogos) do

        verificarJogo(jogo)

    end

    print("")
    linha()
    print("PC NOVO PRONTO PARA JOGAR!")
    linha()

end


-- ==========================================
-- INICIAR
-- ==========================================

iniciarPC()
